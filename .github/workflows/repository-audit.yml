name: Repository Audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate shell syntax
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
      - name: Compile Python sources
        run: python -m compileall -q scripts
      - name: Validate JSON
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          for path in Path('.').rglob('*.json'):
              if '.git' not in path.parts:
                  json.loads(path.read_text())
          print('JSON validation: PASS')
          PY
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD || git diff --check
      - name: Reject tracked model weights
        run: |
          if git ls-files | grep -Ei '\.(safetensors|pth|pt|ckpt|bin)$'; then
            echo 'Tracked model weight detected'
            exit 1
          fi
      - name: Secret-pattern smoke test
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.wav' --exclude='*.log'             '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|hf_[A-Za-z0-9]{20,}|BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY)' .; then
            echo 'Potential secret detected'
            exit 1
          fi
